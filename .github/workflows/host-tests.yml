name: host-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-prototypes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run host prototype tests
        run: |
          python PROTOTYPES/energy-harvester-tinyml/tests/test_scheduler.py
          python PROTOTYPES/energy-harvester-tinyml/tests/test_supercap_voltage_proxy.py
          python AGENTS/test_task_graph_executor.py
          python AGENTS/test_policy_gated_executor.py
          python AGENTS/test_energy_broker.py
          python AGENTS/test_brokered_executor.py
          python AGENTS/test_gas_search_gate.py
          python AGENTS/test_energy_observer.py
          python AGENTS/test_claim_gate.py
          python SECURITY/desktop-firewall-components/test_listen_inventory.py
          python SANDBOX/test_gen03_control_stub.py
          python SANDBOX/test_gas_preflight_demo.py
          python SANDBOX/test_energy_observer_demo.py
          python SANDBOX/test_inquiry_stamp_demo.py
          python SANDBOX/run_prototypes.py
          python ENTERPRISE/test_inquiry_completeness.py
          python ENTERPRISE/test_action_consistent.py
          python ENTERPRISE/test_stamp_invariants.py
          python ENTERPRISE/test_price_verbs.py
          python ENTERPRISE/test_commercial_figure_blank.py
          python ENTERPRISE/test_commercial_lane_sealed.py
          python ENTERPRISE/test_lane_fill_aligned.py
          (cd PROTOTYPES/offgrid-ai-box && python test_energy_duty.py)
          (cd PROTOTYPES/offgrid-ai-box && python test_duty_to_policy.py)
